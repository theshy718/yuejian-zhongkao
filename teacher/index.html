<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>阅见 · 老师工作台</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="app.js" defer></script>
</head>
<body>
<main>
  <section id="gate" class="gate" aria-labelledby="gate-title">
    <p class="eyebrow">老师专用</p>
    <h1 id="gate-title">阅见 · 老师工作台</h1>
    <p class="brand-line">学生查询站与本页分开。请输入通行口令后继续。</p>
    <label>通行口令
      <input id="passphrase" type="password" autocomplete="current-password" placeholder="请输入口令" enterkeyhint="go">
    </label>
    <button type="button" id="unlock" class="primary">进入工作台</button>
    <p id="gate-status" class="status error" role="status"></p>
  </section>

  <div id="workbench" class="hidden workbench">
    <header class="chat-header">
      <div class="brand">阅见 <span>老师工作台</span></div>
      <div class="header-actions">
        <button type="button" id="toggle-draft" class="ghost" aria-expanded="false" aria-controls="draft-panel">题库草稿</button>
        <a class="student-link" href="../">学生站</a>
      </div>
    </header>

    <div id="lib-stats" class="stats bar" aria-live="polite">正在读取当前题库…</div>

    <section id="draft-panel" class="draft-panel hidden" aria-labelledby="draft-title">
      <div class="draft-head">
        <h2 id="draft-title">题库草稿</h2>
        <button type="button" id="close-draft" class="ghost small">收起</button>
      </div>
      <p class="muted">填写后会打包成一条「加题入库」消息发给小克，不会立刻写入公开学生站。</p>
      <form id="draft-form">
        <div class="two">
          <label>选文篇名<input name="passage_title" maxlength="200"></label>
          <label>选文作者<input name="passage_author" maxlength="100"></label>
        </div>
        <label>题干 / 图片题说明 <b>*</b>
          <textarea name="stem" rows="4" required maxlength="30000" placeholder="填写完整题干。图片题请补充可检索的文字说明。"></textarea>
        </label>
        <label>参考答案
          <textarea name="answer" rows="3" maxlength="30000" placeholder="没有可核实答案时留空，不要编造。"></textarea>
        </label>
        <fieldset>
          <legend>考点（可多选）<b>*</b></legend>
          <div id="point-checks" class="checks"></div>
        </fieldset>
        <div class="two">
          <label>年份<input name="year" type="number" min="1900" max="2100" placeholder="如 2024"></label>
          <label>地区<input name="region" maxlength="100" placeholder="如 山东烟台"></label>
        </div>
        <label>考试类型<input name="exam_type" maxlength="100" placeholder="中考真题 / 期末 / 自拟（请如实标注）"></label>
        <label>关联课文<input name="related_textbook" maxlength="200" placeholder="可留空，或填关联篇名"></label>
        <label class="inline"><input name="in_class" type="checkbox"> 本题选文为课内课文（仅关联课文不等于课内题）</label>
        <label>出处 <b>*</b><input name="source" required maxlength="1000" placeholder="原卷名称、发布单位或整理者；自拟题须注明"></label>
        <label>来源网址<input name="url" type="url" maxlength="2000" placeholder="可留空"></label>
        <button type="submit" class="primary">发送加题草稿到聊天</button>
        <p id="draft-status" class="status" role="status"></p>
      </form>
    </section>

    <section class="chat" aria-label="与小克对话">
      <div id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions"></div>

      <div class="composer">
        <div class="chips" role="group" aria-label="需求类型">
          <button type="button" class="chip active" data-type="其他">其他</button>
          <button type="button" class="chip" data-type="改网页">改网页</button>
          <button type="button" class="chip" data-type="加题入库">加题入库</button>
          <button type="button" class="chip" data-type="考点讲解片">考点讲解片</button>
        </div>
        <label class="sr-only" for="chat-input">消息</label>
        <textarea id="chat-input" rows="2" maxlength="20000" placeholder="直接跟小克说：改站、加题、讲解片放哪里…" enterkeyhint="send"></textarea>
        <div class="composer-actions">
          <button type="button" id="send" class="primary send">发送</button>
          <button type="button" id="copy-last" class="secondary ghost">复制</button>
        </div>
        <p id="chat-hint" class="hint">消息会发到小克这边；回复会出现在 Grok Bot 对话里。</p>
      </div>
    </section>

    <footer>阅见 · 老师工作台 · 口令仅存本机会话 · 学生站与老师入口分开</footer>
  </div>
</main>
</body>
</html>
